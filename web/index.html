<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWA — Web Analyzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='none' stroke='%236cb6ff' stroke-width='2'/></svg>">
<style>
  :root {
    --bg: #0d1117;
    --bg-inset: #010409;
    --panel: #161b22;
    --border: #30363d;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #6cb6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-inset);
  }
  header .logo {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--accent); font-weight: 700; font-size: 12px; font-family: var(--mono);
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .badge {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }
  header .status {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  header .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); margin-right: 5px; vertical-align: middle;
  }
  header .status.err .dot { background: var(--red); }

  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

  form.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .row { display: flex; gap: 8px; }
  .row.url { margin-bottom: 12px; }
  input[type="url"] {
    flex: 1;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 13px;
  }
  input[type="url"]:focus { outline: none; border-color: var(--accent); }
  button.primary {
    background: #238636;
    color: #fff;
    border: 1px solid rgba(240,246,252,.1);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary:hover { background: #2ea043; }
  button.primary:disabled { opacity: .55; cursor: wait; }
  details.options {
    margin-top: 4px; color: var(--muted); font-size: 12px;
  }
  details.options summary { cursor: pointer; user-select: none; }
  details.options .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 10px;
  }
  details.options label { display: flex; flex-direction: column; gap: 4px; }
  details.options input[type="text"], details.options input[type="number"] {
    background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px;
    color: var(--fg); padding: 6px 10px; font-family: var(--mono); font-size: 12px;
  }
  details.options .check { flex-direction: row; align-items: center; gap: 6px; }
  details.options small { color: var(--muted); }

  #result { margin-top: 20px; }

  .spinner {
    display: none;
    align-items: center; gap: 10px;
    color: var(--muted); font-family: var(--mono); font-size: 12px;
    padding: 12px 0;
  }
  .spinner.on { display: flex; }
  .spinner .ring {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    display: none;
    background: rgba(248,81,73,.1);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--red);
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .error.on { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .verdict-line {
    padding: 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .score {
    font-family: var(--mono); font-size: 28px; font-weight: 700;
    min-width: 90px; text-align: center;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
  }
  .score.good { color: var(--green); } .score.warn { color: var(--yellow); } .score.bad { color: var(--red); }
  .headline { flex: 1; font-size: 14px; }
  .url-line { padding: 0 16px 14px; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-family: var(--mono); text-align: right; }
  .v { font-family: var(--mono); font-size: 12px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .v.good { color: var(--green); border: 1px solid rgba(63,185,80,.4); }
  .v.warn { color: var(--yellow); border: 1px solid rgba(210,153,34,.4); }
  .v.bad  { color: var(--red);   border: 1px solid rgba(248,81,73,.4); }
  .v.info { color: var(--muted); border: 1px solid var(--border); }
  .rec { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; max-width: 520px; }
  td.sel { font-family: var(--mono); font-size: 12px; }

  .actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  button.ghost {
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; font-size: 12px; font-family: var(--mono); cursor: pointer;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  pre.json {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--mono); font-size: 12px;
    overflow: auto; max-height: 480px;
    white-space: pre; color: #a5d6ff;
  }
  footer {
    text-align: center; color: var(--muted); font-size: 11px;
    padding: 20px; border-top: 1px solid var(--border);
    font-family: var(--mono);
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="logo">O</span>
  <h1>OWA</h1>
  <span class="badge">One-Click Web Analyzer</span>
  <span class="status" id="health"><span class="dot"></span>ready</span>
</header>

<main>
  <form class="panel" id="form">
    <div class="row url">
      <input type="url" id="url" placeholder="https://example.com" required spellcheck="false" autocomplete="off">
      <button class="primary" id="btn" type="submit">Анализировать</button>
    </div>
    <details class="options">
      <summary>Дополнительные параметры</summary>
      <div class="grid">
        <label>Селекторы виджетов (через запятую)
          <input type="text" id="selectors" placeholder="#match-widget, .chat">
        </label>
        <label>Ожидание после load, мс
          <input type="number" id="wait" value="5000" min="0" max="60000" step="500">
        </label>
        <label>Таймаут навигации, мс
          <input type="number" id="timeout" value="60000" min="5000" max="120000" step="1000">
        </label>
        <label class="check"><input type="checkbox" id="consoleLogs"> Перехватывать console-логи страницы</label>
      </div>
    </details>
  </form>

  <div class="spinner" id="spinner"><span class="ring"></span><span id="spinnerText">Открываю страницу в headless Chromium…</span></div>
  <div class="error" id="error"></div>
  <div id="result"></div>
</main>

<footer>OWA · локальный анализ через Playwright Chromium · <a href="/api/health">/api/health</a> · POST /api/analyze — JSON для ИИ-агентов</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('/api/health').then(r => r.json()).then(d => {
  if (!d.ok) throw 0;
  $('health').innerHTML = '<span class="dot"></span>ready';
}).catch(() => {
  const el = $('health');
  el.classList.add('err');
  el.innerHTML = '<span class="dot"></span>ошибка';
});

const phases = ['Открываю страницу…', 'Жду динамический контент…', 'Собираю метрики Performance API…', 'Считаю Long Tasks и Core Web Vitals…', 'Формирую отчёт…'];
let phaseTimer = null;

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!url) return;

  const selectors = $('selectors').value.split(',').map(s => s.trim()).filter(Boolean);
  const payload = {
    url,
    selectors,
    waitMs: parseInt($('wait').value, 10) || 5000,
    timeoutMs: parseInt($('timeout').value, 10) || 60000,
    consoleLogs: $('consoleLogs').checked,
  };

  $('btn').disabled = true;
  $('error').classList.remove('on');
  $('result').innerHTML = '';
  $('spinner').classList.add('on');
  let i = 0;
  $('spinnerText').textContent = phases[0];
  phaseTimer = setInterval(() => { i = (i + 1) % phases.length; $('spinnerText').textContent = phases[i]; }, 4000);

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.message || data.error || ('HTTP ' + res.status));
    render(url, data.report);
  } catch (err) {
    const el = $('error');
    el.textContent = 'Ошибка: ' + err.message;
    el.classList.add('on');
  } finally {
    clearInterval(phaseTimer);
    $('spinner').classList.remove('on');
    $('btn').disabled = false;
  }
});

function verdictBadge(v) {
  const map = { good: 'хорошо', warn: 'средне', bad: 'плохо', info: 'инфо' };
  return `<span class="v ${esc(v)}">${map[v] || esc(v)}</span>`;
}

function render(url, d) {
  const m = d.metrics;
  const s = d.interpretation.summary;
  const vc = s.status === 'good' ? 'good' : s.status;

  let html = `
  <div class="actions">
    <button class="ghost" id="btnJson">Показать JSON (для ИИ)</button>
    <button class="ghost" id="btnCopy">Скопировать компактный JSON</button>
    <button class="ghost" id="btnDownload">Скачать отчёт .json</button>
  </div>

  <div class="card">
    <h2>Итог</h2>
    <div class="verdict-line">
      <div class="score ${vc}">${s.score}<span style="font-size:14px;color:var(--muted)">/100</span></div>
      <div class="headline">${esc(s.headline)}</div>
    </div>
    <div class="url-line">${esc(url)} · ${esc(d.meta.analyzedAt)}</div>
  </div>

  <div class="card">
    <h2>Ключевые метрики</h2>
    <table>
      <tr><th>Метрика</th><th style="text-align:right">Значение</th><th>Вердикт</th></tr>`;

  for (const f of d.interpretation.findings) {
    const unit = f.unit === '' ? '' : ' ' + f.unit;
    html += `<tr><td>${esc(f.metric)}<span class="rec">${f.recommendation ? esc(f.recommendation) : ''}</span></td>
      <td class="num">${f.value === null ? '—' : esc(f.value) + esc(unit)}</td>
      <td>${verdictBadge(f.verdict)}</td></tr>`;
  }
  html += `</table></div>`;

  // Фазы навигации
  if (m.navigation) {
    const n = m.navigation;
    html += `<div class="card"><h2>Фазы навигации</h2><table>
      <tr><th>Фаза</th><th style="text-align:right">Время</th></tr>
      <tr><td>DNS</td><td class="num">${n.dns} мс</td></tr>
      <tr><td>TCP</td><td class="num">${n.tcp} мс</td></tr>
      <tr><td>SSL</td><td class="num">${n.ssl} мс</td></tr>
      <tr><td>TTFB</td><td class="num">${Math.round(n.ttfb)} мс</td></tr>
      <tr><td>DOM interactive</td><td class="num">${Math.round(n.domInteractive)} мс</td></tr>
      <tr><td>DOM complete</td><td class="num">${Math.round(n.domComplete)} мс</td></tr>
    </table></div>`;
  }

  // Виджеты
  html += `<div class="card"><h2>Виджеты (время появления)</h2><table>
    <tr><th>Селектор</th><th style="text-align:right">Время</th></tr>`;
  for (const [sel, t] of Object.entries(m.customWidgets.results)) {
    const auto = m.customWidgets.autoDetectedSelectors.includes(sel) ? ' <span class="v info">авто</span>' : '';
    html += `<tr><td class="sel">${esc(sel)}${auto}</td><td class="num">${t === null ? 'не найден' : t + ' мс'}</td></tr>`;
  }
  html += `</table></div>`;

  // Ресурсы
  html += `<div class="card"><h2>Ресурсы (${m.resources.count} шт)</h2><table>
    <tr><th>Тип</th><th style="text-align:right">Кол-во</th><th style="text-align:right">Объём</th><th style="text-align:right">Сред. время</th></tr>`;
  const kbFmt = (b) => b >= 1048576 ? (b/1048576).toFixed(2) + ' МБ' : b >= 1024 ? (b/1024).toFixed(1) + ' КБ' : b + ' Б';
  for (const [type, st] of Object.entries(m.resources.byType)) {
    html += `<tr><td class="sel">${esc(type)}</td><td class="num">${st.count}</td><td class="num">${kbFmt(st.totalTransferSize)}</td><td class="num">${Math.round(st.totalDuration/st.count)} мс</td></tr>`;
  }
  html += `</table></div>`;

  // Long tasks
  html += `<div class="card"><h2>Long Tasks</h2><table>
    <tr><td>Долгих задач (&gt;50 мс)</td><td class="num">${m.longTasks.count}</td></tr>
    <tr><td>Макс. длительность</td><td class="num">${m.longTasks.maxDuration} мс</td></tr>
    <tr><td>Total Blocking Time (оценка)</td><td class="num">${Math.round(m.longTasks.totalBlockingTime)} мс</td></tr>
  </table></div>`;

  if (m.jsErrors && m.jsErrors.length) {
    html += `<div class="card"><h2>JS-ошибки (${m.jsErrors.length})</h2><table>`;
    for (const e of m.jsErrors.slice(0, 10)) {
      html += `<tr><td class="sel">${esc(e.message)}</td><td class="num">${esc((e.source||'').split('/').pop())}:${e.line}</td></tr>`;
    }
    html += `</table></div>`;
  }

  $('result').innerHTML = html;

  const compact = { schemaVersion: 1, tool: 'owa', url: d.meta.url, summary: s, keyMetrics: {
    loadMs: m.legacyTiming && m.legacyTiming.loadTime, lcpMs: m.vitals && m.vitals.lcpMs, cls: m.vitals && m.vitals.cls,
    longTasks: m.longTasks && m.longTasks.count, resources: m.resources && m.resources.count,
    jsErrors: (m.jsErrors || []).length, widgets: m.customWidgets && m.customWidgets.results } };

  $('btnJson').addEventListener('click', () => {
    if ($('jsonBox')) { $('jsonBox').remove(); return; }
    const pre = document.createElement('pre');
    pre.className = 'json'; pre.id = 'jsonBox';
    pre.textContent = JSON.stringify(d, null, 2);
    $('result').appendChild(pre);
  });
  $('btnCopy').addEventListener('click', async (e) => {
    await navigator.clipboard.writeText(JSON.stringify(compact, null, 2));
    e.target.textContent = 'Скопировано ✓';
    setTimeout(() => { e.target.textContent = 'Скопировать компактный JSON'; }, 1500);
  });
  $('btnDownload').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'owa-report-' + url.replace(/^https?:\/\//, '').replace(/[^\w.-]+/g, '_') + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
}
</script>
</body>
</html>
